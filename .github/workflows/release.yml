name: Release

on:
  push:
    tags:
      - "v0.2.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release environment
        run: python -m pip install --upgrade pip && python -m pip install ".[test,release,viz]"
      - name: Verify source and tests
        run: |
          ruff check src tests tools scripts
          python scripts/run_coverage.py
          python scripts/verify_version.py --tag "${GITHUB_REF_NAME}"
          python scripts/check_markdown_links.py
          check-manifest --verbose
          python -m pip_audit . --skip-editable --progress-spinner=off
      - name: Build and audit distributions
        run: |
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          python scripts/build_release_metadata.py --dist dist
          python scripts/verify_release.py --dist dist
      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/dwi2cond_xp.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## dwi2cond-xp v0.2.0

          Adds pure-Python raw-DWI preprocessing for the fixed SimNIBS 4.6 `dwi2cond`
          workflow. FSL is no longer required at runtime.

          ### Highlights

          - Added `nomoco` and legacy motion/eddy-current preprocessing.
          - Added GRE/FUGUE, TOPUP, single-shell EDDY `--repol`, FLIRT, four-level FNIRT,
            and nonlinear PPD tensor reorientation.
          - Added a unified workflow with validated caching, atomic manifests, QA,
            resource metrics, and progress reporting.
          - Added cross-platform packages, checksums, an SBOM, and build provenance.

          ### Scope

          This is the fixed subset used by SimNIBS 4.6, not a general FSL replacement.
          GRE input must already be unwrapped radians per second. For the latest
          correctness fixes, use v0.3.0.

          [README](https://github.com/ayakacxy/dwi2cond-xp/tree/v0.2.0#readme) ·
          [Validation](https://github.com/ayakacxy/dwi2cond-xp/blob/v0.2.0/docs/VALIDATION.md) ·
          [Changelog](https://github.com/ayakacxy/dwi2cond-xp/blob/v0.2.0/docs/CHANGELOG.md)
          EOF

          probe_file="${RUNNER_TEMP}/dwi2cond-release-probe.txt"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            >"${probe_file}" 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.whl dist/*.tar.gz dist/*.json --clobber
            gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --verify-tag
          elif grep -Fq "HTTP 404" "${probe_file}"; then
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.whl dist/*.tar.gz dist/*.json \
              --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS
          else
            cat "${probe_file}" >&2
            exit 1
          fi
