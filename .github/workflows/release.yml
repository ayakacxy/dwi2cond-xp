name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TMPDIR: ${{ github.workspace }}/.work/ci-release/tmp
      TMP: ${{ github.workspace }}/.work/ci-release/tmp
      TEMP: ${{ github.workspace }}/.work/ci-release/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/ci-release/pip
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.work/ci-release/numba
      XDG_CACHE_HOME: ${{ github.workspace }}/.work/ci-release/cache
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.work/ci-release/pycache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare project temporary and cache directories
        run: mkdir -p .work/ci-release/tmp .work/ci-release/pip .work/ci-release/numba .work/ci-release/cache .work/ci-release/pycache
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release environment
        run: python -m pip install --upgrade pip && python -m pip install ".[test,release,viz]"
      - name: Verify source and tests
        run: |
          ruff check src tests tools scripts
          python scripts/run_coverage.py
          python scripts/verify_version.py --tag "${GITHUB_REF_NAME}"
          python scripts/check_markdown_links.py
          check-manifest --verbose
          python -m pip_audit . --skip-editable --progress-spinner=off
      - name: Build and audit distributions
        run: |
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          python scripts/build_release_metadata.py --dist dist
          python scripts/verify_release.py --dist dist
          python scripts/extract_release_notes.py --tag "${GITHUB_REF_NAME}" \
            --changelog docs/en/CHANGELOG.md --chinese-changelog docs/zh/CHANGELOG.md \
            --output .work/ci-release/release-notes.md
      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/dwi2cond_xp.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_probe="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1)"; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz dist/*.json --clobber
            gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --verify-tag \
              --notes-file .work/ci-release/release-notes.md
          elif [[ "${release_probe}" == *"HTTP 404"* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.whl dist/*.tar.gz dist/*.json dist/SHA256SUMS \
              --verify-tag --notes-file .work/ci-release/release-notes.md
          else
            printf '%s\n' "${release_probe}" >&2
            exit 1
          fi
