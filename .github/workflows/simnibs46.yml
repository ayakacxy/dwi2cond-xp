name: SimNIBS 4.6 integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: [self-hosted, simnibs46]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify frozen integration environment
        run: |
          python -c "import simnibs; assert simnibs.__version__ == '4.6.0'"
          python -m pip check
      - name: Install project without changing environment dependencies
        run: python -m pip install --no-deps -e .
      - name: Run contracts and CLI smoke tests
        run: |
          pytest -q --cov=dwi2cond_xp --cov-report=term --cov-fail-under=100
          dwi2cond-xp --help
          dwi2cond-xp simulate-tdcs --help
          dwi2cond-xp simulate-leadfield --help
