name: SimNIBS 4.6 integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: [self-hosted, simnibs46]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify frozen integration environment
        run: |
          python scripts/verify_simnibs_environment.py --json simnibs46-environment.json
          python -m pip check
      - name: Create an isolated overlay from the frozen runtime
        run: |
          python -m venv --system-site-packages "${RUNNER_TEMP}/dwi2cond-simnibs46"
          "${RUNNER_TEMP}/dwi2cond-simnibs46/bin/python" -m pip install --no-deps .
      - name: Verify project installation preserved the frozen runtime
        run: |
          "${RUNNER_TEMP}/dwi2cond-simnibs46/bin/python" scripts/verify_simnibs_environment.py
          "${RUNNER_TEMP}/dwi2cond-simnibs46/bin/python" -m pip check
      - name: Run contracts and CLI smoke tests
        run: |
          "${RUNNER_TEMP}/dwi2cond-simnibs46/bin/python" -m pytest -q
          "${RUNNER_TEMP}/dwi2cond-simnibs46/bin/dwi2cond-xp" --help
          "${RUNNER_TEMP}/dwi2cond-simnibs46/bin/dwi2cond-xp" simulate-tdcs --help
          "${RUNNER_TEMP}/dwi2cond-simnibs46/bin/dwi2cond-xp" simulate-leadfield --help
