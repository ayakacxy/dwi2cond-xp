name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TMPDIR: ${{ github.workspace }}/.work/ci-release/tmp
      TMP: ${{ github.workspace }}/.work/ci-release/tmp
      TEMP: ${{ github.workspace }}/.work/ci-release/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/ci-release/pip
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.work/ci-release/numba
      XDG_CACHE_HOME: ${{ github.workspace }}/.work/ci-release/cache
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.work/ci-release/pycache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare project temporary and cache directories
        shell: bash
        run: mkdir -p .work/ci-release/tmp .work/ci-release/pip .work/ci-release/numba .work/ci-release/cache .work/ci-release/pycache
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,viz]"
      - name: Lint
        run: ruff check src tests tools scripts
      - name: Run contracts and Numba-aware coverage gate
        run: python scripts/run_coverage.py
      - name: Verify documentation and version metadata
        run: |
          python scripts/verify_version.py
          python scripts/check_markdown_links.py
      - name: Verify CLI
        run: dwi2cond-xp --help

  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TMPDIR: ${{ github.workspace }}/.work/ci-release/tmp
      TMP: ${{ github.workspace }}/.work/ci-release/tmp
      TEMP: ${{ github.workspace }}/.work/ci-release/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/ci-release/pip
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.work/ci-release/numba
      XDG_CACHE_HOME: ${{ github.workspace }}/.work/ci-release/cache
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.work/ci-release/pycache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare project temporary and cache directories
        run: mkdir -p .work/ci-release/tmp .work/ci-release/pip .work/ci-release/numba .work/ci-release/cache .work/ci-release/pycache
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[release]"
          validate-pyproject pyproject.toml
          check-manifest --verbose
          python -m pip_audit . --skip-editable --progress-spinner=off
          python -m build
      - name: Audit release contents
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          python scripts/build_release_metadata.py --dist dist
          python scripts/verify_release.py --dist dist
      - name: Test wheel installation
        run: |
          python -m venv .work/ci-release/wheel-venv
          .work/ci-release/wheel-venv/bin/python -m pip install --upgrade pip
          .work/ci-release/wheel-venv/bin/python -m pip install dist/*.whl
          .work/ci-release/wheel-venv/bin/dwi2cond-xp --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
