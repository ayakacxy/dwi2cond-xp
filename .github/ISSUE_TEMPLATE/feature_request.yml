name: Feature request / 功能建议
description: Suggest a feature and how to validate it. / 提出具体功能及验证方法。
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Describe the scientific requirements using shareable synthetic examples; do not upload human MRI or controlled data. / 请用可分享的合成样例说明科学要求，不上传人体 MRI 或受控数据。"
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users / 问题与使用人群
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed inputs, outputs, coordinates, and error handling / 输入、输出、坐标与错误处理
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Reference and validation plan / 参考方法与验证计划
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation / 内容检查
      options:
        - label: This request does not include private medical data or credentials. / 本建议不包含私有医学数据或凭据。
          required: true
