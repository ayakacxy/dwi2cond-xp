name: Feature request
description: Suggest a feature and how to validate it.
title: '[Feature]: '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: Describe the scientific requirements using shareable synthetic examples; do not upload human MRI or controlled data.
- type: textarea
  id: problem
  attributes:
    label: Problem and intended users
  validations:
    required: true
- type: textarea
  id: contract
  attributes:
    label: Proposed inputs, outputs, coordinates, and error handling
  validations:
    required: true
- type: textarea
  id: validation
  attributes:
    label: Reference and validation plan
  validations:
    required: true
- type: checkboxes
  id: scope
  attributes:
    label: Scope confirmation
    options:
    - label: This request does not include private medical data or credentials.
      required: true
