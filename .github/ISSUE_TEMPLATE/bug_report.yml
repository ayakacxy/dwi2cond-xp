name: Bug report / 缺陷报告
description: Report a reproducible software or numerical defect. / 报告可复现的软件或数值问题，不附医学数据。
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not upload human MRI, subject identifiers, credentials, or private paths. Prefer a synthetic example. / 请勿上传人体 MRI、被试标识、凭据或私有路径，尽量提供合成样例。"
  - type: input
    id: version
    attributes:
      label: dwi2cond-xp version / 软件版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Operating system, Python, SimNIBS, NumPy, and SciPy versions. / 操作系统及各软件版本。
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or minimal code / 命令或最小代码
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and traceback / 实际结果与异常堆栈
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私检查
      options:
        - label: I removed human data, subject identifiers, credentials, and private paths. / 已移除人体数据、被试标识、凭据和私有路径。
          required: true
