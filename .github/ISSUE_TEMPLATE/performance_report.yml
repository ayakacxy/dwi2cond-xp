name: Performance report
description: Report performance and state which steps were timed.
title: '[Performance]: '
labels:
- performance
body:
- type: textarea
  id: hardware
  attributes:
    label: Hardware and software
    description: CPU, memory, OS, Python, packages, threads, and solver. / CPU、内存、操作系统、软件版本、线程数与求解器。
  validations:
    required: true
- type: textarea
  id: boundary
  attributes:
    label: Input and timed steps
    description: Shapes, shells, voxels, precision, I/O, warmup, repeats, synchronization, and outputs.
  validations:
    required: true
- type: textarea
  id: results
  attributes:
    label: Results and numerical comparison
  validations:
    required: true
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy confirmation
    options:
    - label: I did not attach human MRI, subject identifiers, credentials, or private paths.
      required: true
