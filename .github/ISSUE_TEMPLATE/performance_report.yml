name: Performance report / 性能报告
description: Report performance and state which steps were timed. / 报告性能结果或退化，并说明计时范围。
title: "[Performance]: "
labels: [performance]
body:
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and software / 硬件与软件
      description: CPU, memory, OS, Python, packages, threads, and solver. / CPU、内存、操作系统、软件版本、线程数与求解器。
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Input and timed steps / 输入与计时范围
      description: Shapes, shells, voxels, precision, I/O, warmup, repeats, synchronization, and outputs. / 形状、壳层、体素数、精度、读写、预热、重复次数、同步和输出。
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and numerical comparison / 结果与数值比较
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私检查
      options:
        - label: I did not attach human MRI, subject identifiers, credentials, or private paths. / 未附人体 MRI、被试标识、凭据或私有路径。
          required: true
