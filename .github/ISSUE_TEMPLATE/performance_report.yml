name: Performance report
description: Report a benchmark or regression with a complete timing boundary.
title: "[Performance]: "
labels: [performance]
body:
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and software
      description: CPU, memory, OS, Python, package versions, threads, and solver.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Input and timing boundary
      description: Shapes, shells, voxels, precision, I/O, warmup, repeats, synchronization, and outputs.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and numerical comparison
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach human MRI, subject identifiers, credentials, or private paths.
          required: true
